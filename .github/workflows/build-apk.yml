name: Build signed APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A random signing key is generated once and kept in the Actions cache,
      # so later builds are signed with the same key (and can update each
      # other on the device). If GitHub evicts the cache (unused for 7 days),
      # a new key is generated and the app must be reinstalled once.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: signing
          key: release-signing-key-v1

      - name: Generate signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p signing
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore signing/release.jks -alias release \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Hebron File Manager, O=Hebron, C=IL"
          echo "$PASS" > signing/pass.txt

      - name: Build release APK
        run: |
          PASS=$(cat signing/pass.txt)
          chmod +x gradlew
          SIGNING_KEY_ALIAS=release \
          SIGNING_KEY_PASSWORD="$PASS" \
          SIGNING_STORE_PASSWORD="$PASS" \
          SIGNING_STORE_FILE="$GITHUB_WORKSPACE/signing/release.jks" \
          ./gradlew assembleFossRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: file-manager-signed-apk
          path: app/build/outputs/apk/foss/release/*.apk
